{% extends "base.html" %}

{% block title %}{{ page.title }} | analog-alex{% endblock title %}

{% block content %}
<article class="article">
  <header class="article-header">
    <p class="date-line">{{ page.date }}</p>
    <h1 class="title">{{ page.title }}</h1>
  </header>
  <div class="article-body">{{ page.content | safe }}</div>
</article>

{% endblock content %}
