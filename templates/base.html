<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}analog-alex{% endblock title %}</title>
  <link rel="stylesheet" href="{{ get_url(path="style.css", cachebust=true) }}">
  <script>
    const storedTheme = localStorage.getItem('theme');
    const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

    document.documentElement.dataset.theme = storedTheme || preferredTheme;
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <a class="banner-link" href="/">Analog Alex</a>
        <p class="subbanner">Regular Updates</p>
      </div>
      <div class="header-actions">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/blog">Articles</a>
          <a href="/games">Games</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-text">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock content %}
  </main>

  <footer class="footer">
    <div class="footer-rule"></div>
    <p class="info-text">Made by <strong>Miguel Alexandre</strong></p>
    <p class="info-text">Powered by <a href="https://www.getzola.org/">Zola</a> · ❤️ static websites</p>
    <p class="info-text">@2025</p>
  </footer>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const themeToggleIcon = document.querySelector('.theme-toggle-icon');
    const themeToggleText = document.querySelector('.theme-toggle-text');

    function setTheme(theme) {
      const isDark = theme === 'dark';

      document.documentElement.dataset.theme = theme;
      localStorage.setItem('theme', theme);
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggleIcon.textContent = isDark ? '☀' : '☾';
      themeToggleText.textContent = isDark ? 'Light' : 'Dark';
    }

    setTheme(document.documentElement.dataset.theme);

    themeToggle.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
