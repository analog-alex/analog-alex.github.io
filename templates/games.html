{% extends "base.html" %}

{% block title %}{{ section.title }} | analog-alex{% endblock title %}

{% block content %}
<section class="page-card page-card-wide games-card" aria-labelledby="games-title">
  <img class="games-visual" src="{{ get_url(path="games-board-alpha.png") }}" alt="" width="1774" height="887" aria-hidden="true">

  <p class="eyebrow">Playable experiments</p>
  <h1 id="games-title">{{ section.title }}</h1>

  <div class="games-copy">
    <p>Small browser games will live here as they become playable.</p>
  </div>

  <ul class="games-list" aria-label="Games list">
    <li class="game-item">
      <span>
        <strong>First game</strong>
        <span>Coming soon</span>
      </span>
    </li>
  </ul>
</section>
{% endblock content %}
